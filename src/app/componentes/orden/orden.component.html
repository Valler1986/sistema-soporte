<section class="orden-page">
  <div class="page-header">
    <div>
      <p class="eyebrow">Servicio técnico</p>
      <h1>Nueva Orden de Servicio</h1>
    </div>
  </div>

  <form class="orden-form" (ngSubmit)="guardarOrden()" novalidate>
    <section class="form-section">
      <h2>Datos del Cliente</h2>
      <div class="divider"></div>

      <div class="fila">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" [(ngModel)]="order.nombre" placeholder="Ingrese el nombre" required />
        </div>

        <div class="campo">
          <label for="apellidos">Apellidos</label>
          <input id="apellidos" name="apellidos" type="text" [(ngModel)]="order.apellidos" placeholder="Ingrese los apellidos" required />
        </div>

        <div class="campo">
          <label for="dni">DNI</label>
          <input id="dni" name="dni" type="text" [(ngModel)]="order.dni" placeholder="Ingrese el DNI" minlength="8" maxlength="8" pattern="\d{8}" required />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h2>Datos del Artefacto</h2>
      <div class="divider"></div>

      <div class="fila">
        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo" name="tipo" [(ngModel)]="order.tipo" required>
            <option value="">Seleccione una opción</option>
            <option value="Refrigeradora">Refrigeradora</option>
            <option value="Lavadora">Lavadora</option>
            <option value="Televisor">Televisor</option>
            <option value="Microondas">Microondas</option>
            <option value="Cocina">Cocina</option>
            <option value="Computadora">Computadora</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="campo">
          <label for="marca">Marca</label>
          <input id="marca" name="marca" type="text" [(ngModel)]="order.marca" placeholder="Ingrese la marca" required />
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label for="serie">N° de serie</label>
          <input id="serie" name="serie" type="text" [(ngModel)]="order.serie" placeholder="Número de serie" />
        </div>

        <div class="campo">
          <label for="anio">Año de fabricación</label>
          <input id="anio" name="anio" type="number" [(ngModel)]="order.anio" placeholder="Ej. 2022" />
        </div>
      </div>

      <div class="fila two-columns">
        <div class="campo">
          <label for="problema">Descripción del problema</label>
          <textarea id="problema" name="problema" [(ngModel)]="order.problema" placeholder="Describa el problema del artefacto" required></textarea>
        </div>

        <div class="campo">
          <label for="diagnostico">Diagnóstico</label>
          <textarea id="diagnostico" name="diagnostico" [(ngModel)]="order.diagnostico" placeholder="Ingrese el diagnóstico técnico"></textarea>
        </div>
      </div>
    </section>

    <section class="form-section">
      <h2>Datos del Pedido</h2>
      <div class="divider"></div>

      <div class="fila cuatro-columnas">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input id="fecha" name="fecha" type="date" [(ngModel)]="order.fecha" required />
        </div>

        <div class="campo">
          <label for="dniCliente">DNI del cliente</label>
          <input id="dniCliente" name="dniCliente" type="text" [(ngModel)]="order.dni" placeholder="DNI" minlength="8" maxlength="8" pattern="\d{8}" required />
        </div>

        <div class="campo">
          <label for="fechaEntrega">Fecha de entrega</label>
          <input id="fechaEntrega" name="fechaEntrega" type="date" [(ngModel)]="order.fechaEntrega" required />
        </div>

        <div class="campo">
          <label for="costo">Costo total</label>
          <input id="costo" name="costo" type="number" [(ngModel)]="order.costo" placeholder="S/ 0.00" min="1" required />
        </div>
      </div>
    </section>

    <div class="acciones">
      <button type="submit" class="btn-guardar">Guardar Orden</button>
    </div>

    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
  </form>
</section>
