
<div class="sistema">

  <!-- BARRA SUPERIOR -->
  <header class="barra-superior">
    <div class="controles">
      <span class="circulo rojo"></span>
      <span class="circulo amarillo"></span>
      <span class="circulo verde"></span>
    </div>

    <div class="titulo-barra">
      TecFix - Servicio Técnico
    </div>
  </header>

  <div class="contenido">

    <!-- MENÚ LATERAL -->
    <aside class="menu">

      <button class="menu-item activo">
        Inicio
      </button>

      <button class="menu-item">
        Nueva Orden
      </button>

      <button class="menu-item">
        Estado de Órdenes
      </button>

      <button class="menu-item">
        Reportes
      </button>

    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="principal">

      <h1>Nueva Orden de Servicio</h1>

      <!-- DATOS DEL CLIENTE -->
      <section class="seccion">

        <h2>Datos del Cliente</h2>

        <div class="linea"></div>

        <div class="fila">

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              placeholder="Ingrese el nombre">
          </div>

          <div class="campo">
            <label for="apellidos">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              placeholder="Ingrese los apellidos">
          </div>

          <div class="campo">
            <label for="dni">DNI</label>
            <input
              type="text"
              id="dni"
              placeholder="Ingrese el DNI">
          </div>

        </div>

      </section>


      <!-- DATOS DEL ARTEFACTO -->
      <section class="seccion">

        <h2>Datos del Artefacto</h2>

        <div class="linea"></div>

        <div class="fila">

          <div class="campo">
            <label for="tipo">Tipo</label>

            <select id="tipo">
              <option value="">Seleccione una opción</option>
              <option value="refrigeradora">Refrigeradora</option>
              <option value="lavadora">Lavadora</option>
              <option value="televisor">Televisor</option>
              <option value="microondas">Microondas</option>
              <option value="cocina">Cocina</option>
              <option value="computadora">Computadora</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="campo">
            <label for="marca">Marca</label>

            <input
              type="text"
              id="marca"
              placeholder="Ingrese la marca">
          </div>

        </div>

        <div class="fila">

          <div class="campo">
            <label for="serie">Serie</label>

            <input
              type="text"
              id="serie"
              placeholder="Número de serie">
          </div>

          <div class="campo">
            <label for="anio">Año de fabricación</label>

            <input
              type="number"
              id="anio"
              placeholder="Ej. 2022">
          </div>

        </div>

        <div class="fila">

          <div class="campo">
            <label for="problema">
              Descripción del problema
            </label>

            <textarea
              id="problema"
              placeholder="Describa el problema del artefacto">
            </textarea>
          </div>

          <div class="campo">
            <label for="diagnostico">
              Diagnóstico
            </label>

            <textarea
              id="diagnostico"
              placeholder="Ingrese el diagnóstico técnico">
            </textarea>
          </div>

        </div>

      </section>


      <!-- DATOS DEL PEDIDO -->
      <section class="seccion">

        <h2>Datos del Pedido</h2>

        <div class="linea"></div>

        <div class="fila datos-pedido">

          <div class="campo">
            <label for="fecha">Fecha</label>

            <input
              type="date"
              id="fecha">
          </div>

          <div class="campo">
            <label for="dniCliente">
              DNI del cliente
            </label>

            <input
              type="text"
              id="dniCliente"
              placeholder="DNI">
          </div>

          <div class="campo">
            <label for="fechaEntrega">
              Fecha de entrega estimada
            </label>

            <input
              type="date"
              id="fechaEntrega">
          </div>

          <div class="campo">
            <label for="costo">
              Costo total
            </label>

            <input
              type="number"
              id="costo"
              placeholder="S/ 0.00">
          </div>

        </div>

      </section>


      <!-- BOTÓN -->
      <div class="acciones">

        <button class="btn-guardar">
          Guardar Orden
        </button>

      </div>

    </main>

  </div>

</div>
